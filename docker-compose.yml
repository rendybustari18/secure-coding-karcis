services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karcis_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: db_karcis
      APP_HOST: "/"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./files:/var/www/html/files
    networks:
      - karcis_network

  db:
    image: mysql:8.0
    container_name: karcis_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_karcis
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db_karcis.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - karcis_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: karcis_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - karcis_network

volumes:
  db_data:
    driver: local

networks:
  karcis_network:
    driver: bridge
